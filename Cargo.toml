[package]
name = "rocket_dyn_templates"
version = "0.1.0"
authors = ["Sergio Benitez <sb@sergio.bz>"]
description = "Dynamic templating engine integration for Rocket."
documentation = "https://api.rocket.rs/master/rocket_dyn_templates/"
homepage = "https://rocket.rs"
repository = "https://github.com/rwf2/Rocket/tree/master/contrib/dyn_templates"
readme = "README.md"
keywords = ["rocket", "framework", "templates", "templating", "tera"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.75"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
rust_2018_idioms = "warn"
async_fn_in_trait = "allow"
refining_impl_trait = "allow"
# unreachable_pub = "warn"
# single_use_lifetimes = "warn"
# missing_docs = "warn"

[lints.clippy]
type_complexity = "allow"
module_inception = "allow"
multiple_bound_locations = "allow"
manual_range_contains = "allow"

[features]
tera = ["dep:tera"]

[dependencies]
walkdir = "2.4"
notify = "7"
normpath = "1"

tera = { version = "1.19.0", optional = true }

[dependencies.rocket]
version = "0.6.0-dev"
git = "https://github.com/rwf2/Rocket"
default-features = false

[dev-dependencies]
pretty_assertions = "1.4"

[package.metadata.docs.rs]
all-features = true
