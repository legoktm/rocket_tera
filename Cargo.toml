[package]
name = "rocket_tera"
version = "2.0.0-rc1"
authors = ["Sergio Benitez <sb@sergio.bz>", "Kunal Mehta <legoktm@debian.org>"]
description = "Tera templating integration for Rocket."
documentation = "https://docs.rs/rocket_tera"
homepage = "https://github.com/legoktm/rocket_tera"
repository = "https://github.com/legoktm/rocket_tera"
readme = "README.md"
keywords = ["rocket", "templates", "templating", "tera"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
all = {level = "deny", priority = -1}
uninlined_format_args = "deny"

[lints.rustdoc]
all = {level = "deny", priority = -1}

[dependencies]
walkdir = "2.4"
notify = "8"
normpath = "1"

tera = "2.3.0"

[features]
contrib-base64 = ["dep:tera-contrib", "tera-contrib/base64"]
contrib-date = ["dep:tera-contrib", "tera-contrib/date"]
contrib-filesize_format = ["dep:tera-contrib", "tera-contrib/filesize_format"]
contrib-format = ["dep:tera-contrib", "tera-contrib/format"]
contrib-json = ["dep:tera-contrib", "tera-contrib/json"]
contrib-rand = ["dep:tera-contrib", "tera-contrib/rand"]
contrib-regex = ["dep:tera-contrib", "tera-contrib/regex"]
contrib-slug = ["dep:tera-contrib", "tera-contrib/slug"]
contrib-urlencode = ["dep:tera-contrib", "tera-contrib/urlencode"]

[dependencies.tera-contrib]
version = "0.3"
optional = true
default-features = false

[dependencies.rocket]
version = "0.5.1"
default-features = false

[dev-dependencies]
pretty_assertions = "1.4"

[[example]]
name = "templating"
test = true
