name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      - name: rustfmt
        run: cargo +stable fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: clippy
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: clippy (all features)
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

  rustdoc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: rustdoc
        run: cargo +nightly doc --no-deps --all-features

  test:
    name: ${{ matrix.toolchain }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msrv, stable, nightly]
        os: [ubuntu-latest]
        # Template reloading and path handling are platform-specific.
        include:
          - toolchain: stable
            os: macos-latest
          - toolchain: stable
            os: windows-latest
    # Nightly tracks unreleased changes; let it report without failing the build.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve toolchain
        id: resolve
        run: |
          if [ "${MATRIX_TOOLCHAIN}" = "msrv" ]; then
            # Read `rust-version` from Cargo.toml rather than duplicating it here.
            toolchain="$(cargo metadata --format-version 1 --no-deps --offline \
              | jq -er '.packages[0].rust_version')"
          else
            toolchain="${MATRIX_TOOLCHAIN}"
          fi
          echo "Resolved toolchain: $toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Install toolchain
        run: rustup toolchain install ${TOOLCHAIN} --profile minimal --no-self-update
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.toolchain }}

      - name: test
        run: cargo +${TOOLCHAIN} test
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.toolchain }}

      # The `contrib-*` features are off by default, so they need their own run.
      - name: test (all features)
        run: cargo +${TOOLCHAIN} test --all-features
        env:
          TOOLCHAIN: ${{ steps.resolve.outputs.toolchain }}
